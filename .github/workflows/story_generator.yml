name: Step 1 - Story Generation (Ollama)

on:
  workflow_dispatch:

jobs:
  generate_story:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allows the runner to commit and push files back to the repo
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /dev/null 2>&1 &
          sleep 5

      - name: Pull Qwen2.5-VL 3B Model
        run: ollama pull qwen2.5vl:3b

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ollama pillow

      - name: Run Vision Analysis & Story Script
        run: python -u generate_story.py

      - name: Commit and Save Prompt Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add story_history.json next_reel_instructions.json
          git commit -m "automation: saved prompts and memory for next sequence" || echo "No changes"
          git push
